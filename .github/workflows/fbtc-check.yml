name: Check Locked FBTC

# FBTC's backing is split across FBTC and Locked FBTC tokens listed in tokens/fbtc. This fails when a
# new Locked FBTC token appears or the tokens no longer add up to the reserves feed, see
# scripts/check_locked_fbtc.ts.

on:
    schedule:
        - cron: "17 6 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - name: Install Dependencies
              run: bun install --frozen-lockfile
            - name: Check Locked FBTC
              env:
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
              run: bun scripts/check_locked_fbtc.ts
