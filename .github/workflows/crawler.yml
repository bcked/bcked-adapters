name: Crawler Execution

on:
    schedule:
        # Runs "At minute 0 (every hour)." (see https://crontab.guru)
        - cron: "0 * * * *"
    workflow_dispatch:
        inputs:
            commit:
                description: "Commit collected records to the records branch"
                type: boolean
                default: true

# Allow one concurrent crawl
concurrency:
    group: "crawler"
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    crawler:
        runs-on: ubuntu-latest
        name: Crawler Execution
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Checkout Records
              uses: actions/checkout@v7
              with:
                  ref: records
                  path: .records
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - name: Install Dependencies
              run: bun install --frozen-lockfile
            - name: Load Records
              run: rsync -a --prune-empty-dirs --include='*/' --include='**/records/**' --exclude='*' .records/ ./
            - name: Execute Job
              env:
                  ALCHEMY_ETHEREUM: ${{ secrets.ALCHEMY_ETHEREUM }}
                  ALCHEMY_POLYGON: ${{ secrets.ALCHEMY_POLYGON }}
                  ALCHEMY_SOLANA: ${{ secrets.ALCHEMY_SOLANA }}
                  ALCHEMY_ARBITRUM: ${{ secrets.ALCHEMY_ARBITRUM }}
                  ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
                  BCKED_WATCHER_BOT_TOKEN: ${{ secrets.BCKED_WATCHER_BOT_TOKEN }}
              run: bun run crawler
            - name: Store Records
              # Keep data collected before a failure.
              if: ${{ !cancelled() }}
              run: rsync -a --prune-empty-dirs --exclude='/.records/' --exclude='node_modules/' --include='*/' --include='**/records/**' --exclude='*' ./ .records/
            - name: Commit Results on records Branch
              if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.commit) }}
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  repository: .records
                  commit_message: Update data
                  commit_user_name: GitHub Action
                  commit_user_email: action@github.com
                  commit_author: actions-user <action@github.com>
                  file_pattern: "*.csv *.json"
