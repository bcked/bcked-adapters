name: Rebuild History

# Rebuilds price, supply and custody history from Chainlink feeds and token contracts through
# archive calls (scripts/history). Run by hand, one part and one span of years per run, so each run
# finishes and commits within the job's time limit. Days that already have a row are kept.

on:
    workflow_dispatch:
        inputs:
            part:
                description: "What to rebuild"
                required: true
                default: "prices"
                type: choice
                options: [prices, onchain]
            from:
                description: "First day (YYYY-MM-DD)"
                required: false
                default: "2019-01-01"
            to:
                description: "Day after the last day (YYYY-MM-DD), empty for today"
                required: false
                default: ""

# Shares the group with the crawler, so both never push to the records at the same time.
concurrency:
    group: "crawler"
    cancel-in-progress: false

jobs:
    rebuild:
        runs-on: ubuntu-latest
        timeout-minutes: 340
        name: Rebuild History
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Checkout Records
              uses: actions/checkout@v7
              with:
                  ref: records
                  path: .records
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - name: Install Dependencies
              run: bun install --frozen-lockfile
            - name: Rebuild Prices
              if: ${{ inputs.part == 'prices' }}
              working-directory: .records
              env:
                  ALCHEMY_ETHEREUM: ${{ secrets.ALCHEMY_ETHEREUM }}
              run: bun ../scripts/history/rebuild_prices.ts ${{ inputs.from }} ${{ inputs.to }}
            - name: Rebuild Supply and Custody
              if: ${{ inputs.part == 'onchain' }}
              working-directory: .records
              env:
                  ALCHEMY_ETHEREUM: ${{ secrets.ALCHEMY_ETHEREUM }}
                  ALCHEMY_ARBITRUM: ${{ secrets.ALCHEMY_ARBITRUM }}
                  ALCHEMY_POLYGON: ${{ secrets.ALCHEMY_POLYGON }}
              run: bun ../scripts/history/rebuild_onchain.ts ${{ inputs.from }} ${{ inputs.to }}
            - name: Commit Results
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  repository: .records
                  commit_message: Rebuild history from Chainlink and token contracts
                  commit_user_name: GitHub Action
                  commit_user_email: action@github.com
                  commit_author: actions-user <action@github.com>
                  file_pattern: "*.csv"
