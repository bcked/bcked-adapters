name: Rebuild History

# Rebuilds price, supply and custody history from Chainlink feeds and token contracts through
# archive calls (scripts/history). Run by hand. One run works through the years one after
# another, each year as its own job that commits its results, so a failure loses at most one year.
# A running workflow is never cancelled by the hourly crawler, which waits for the same group.
# Days that already have a row are kept.

on:
    workflow_dispatch:
        inputs:
            part:
                description: "What to rebuild"
                required: true
                default: "both"
                type: choice
                options: [both, prices, onchain, dex]
            from_year:
                description: "First year of prices"
                required: false
                default: "2020"
            onchain_from_year:
                description: "First year of supply and custody"
                required: false
                default: "2020"
            systems:
                description: "Chains for supply and custody, comma separated, e.g. ethereum,base (empty: all)"
                required: false
                default: ""

# Shares the group with the crawler, so both never push to the records at the same time.
concurrency:
    group: "crawler"
    cancel-in-progress: false

jobs:
    prices:
        if: ${{ inputs.part == 'both' || inputs.part == 'prices' }}
        runs-on: ubuntu-latest
        timeout-minutes: 340
        name: Prices ${{ matrix.year }}
        strategy:
            max-parallel: 1
            fail-fast: true
            matrix:
                year: [2020, 2021, 2022, 2023, 2024, 2025, 2026]
        steps:
            - name: Checkout Code
              if: ${{ matrix.year >= fromJSON(inputs.from_year) }}
              uses: actions/checkout@v7
            - name: Checkout Records
              if: ${{ matrix.year >= fromJSON(inputs.from_year) }}
              uses: actions/checkout@v7
              with:
                  # Private repository. Needs a deploy key of bcked/bcked-records with write access.
                  repository: bcked/bcked-records
                  ref: records
                  path: .records
                  ssh-key: ${{ secrets.RECORDS_DEPLOY_KEY }}
            - name: Setup Bun
              if: ${{ matrix.year >= fromJSON(inputs.from_year) }}
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - name: Install Dependencies
              if: ${{ matrix.year >= fromJSON(inputs.from_year) }}
              run: bun install --frozen-lockfile
            - name: Rebuild Prices
              if: ${{ matrix.year >= fromJSON(inputs.from_year) }}
              working-directory: .records
              env:
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
              run: |
                  to=$(( ${{ matrix.year }} + 1 ))-01-01
                  if [[ "$to" > "$(date -u +%F)" ]]; then to=""; fi
                  bun ../scripts/history/rebuild_prices.ts ${{ matrix.year }}-01-01 $to
            - name: Commit Results
              if: ${{ matrix.year >= fromJSON(inputs.from_year) }}
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  repository: .records
                  commit_message: Rebuild ${{ matrix.year }} prices from Chainlink
                  commit_user_name: GitHub Action
                  commit_user_email: action@github.com
                  commit_author: actions-user <action@github.com>
                  file_pattern: "*.csv"

    dex:
        # Uniswap prices at report dates without a Chainlink price (scripts/history/dex_prices.py), for
        # backing records from before an asset had a feed. Runs after the Chainlink prices, since it
        # only fills what they leave open.
        needs: prices
        if: ${{ always() && inputs.part != 'onchain' && (needs.prices.result == 'success' || needs.prices.result == 'skipped') }}
        runs-on: ubuntu-latest
        timeout-minutes: 340
        name: DEX prices
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Checkout Records
              uses: actions/checkout@v7
              with:
                  # Private repository. Needs a deploy key of bcked/bcked-records with write access.
                  repository: bcked/bcked-records
                  ref: records
                  path: .records
                  ssh-key: ${{ secrets.RECORDS_DEPLOY_KEY }}
            - name: Add DEX Prices
              env:
                  ETHEREUM_RPC: https://eth-mainnet.g.alchemy.com/v2/${{ secrets.ALCHEMY_API_KEY }}
              run: python3 -I scripts/history/dex_prices.py .records
            - name: Commit Results
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  repository: .records
                  commit_message: Add DEX prices at report dates without a Chainlink price
                  commit_user_name: GitHub Action
                  commit_user_email: action@github.com
                  commit_author: actions-user <action@github.com>
                  file_pattern: "*.csv"

    onchain:
        needs: prices
        if: ${{ always() && (inputs.part == 'both' || inputs.part == 'onchain') && (needs.prices.result == 'success' || needs.prices.result == 'skipped') }}
        runs-on: ubuntu-latest
        timeout-minutes: 340
        name: Supply and custody ${{ matrix.year }}
        strategy:
            max-parallel: 1
            fail-fast: true
            matrix:
                year: [2020, 2021, 2022, 2023, 2024, 2025, 2026]
        steps:
            - name: Checkout Code
              if: ${{ matrix.year >= fromJSON(inputs.onchain_from_year) }}
              uses: actions/checkout@v7
            - name: Checkout Records
              if: ${{ matrix.year >= fromJSON(inputs.onchain_from_year) }}
              uses: actions/checkout@v7
              with:
                  # Private repository. Needs a deploy key of bcked/bcked-records with write access.
                  repository: bcked/bcked-records
                  ref: records
                  path: .records
                  ssh-key: ${{ secrets.RECORDS_DEPLOY_KEY }}
            - name: Setup Bun
              if: ${{ matrix.year >= fromJSON(inputs.onchain_from_year) }}
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - name: Install Dependencies
              if: ${{ matrix.year >= fromJSON(inputs.onchain_from_year) }}
              run: bun install --frozen-lockfile
            - name: Rebuild Supply and Custody
              if: ${{ matrix.year >= fromJSON(inputs.onchain_from_year) }}
              working-directory: .records
              env:
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
                  SYSTEMS: ${{ inputs.systems }}
              run: |
                  to=$(( ${{ matrix.year }} + 1 ))-01-01
                  if [[ "$to" > "$(date -u +%F)" ]]; then to=""; fi
                  bun ../scripts/history/rebuild_onchain.ts ${{ matrix.year }}-01-01 $to
            - name: Commit Results
              if: ${{ matrix.year >= fromJSON(inputs.onchain_from_year) }}
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  repository: .records
                  commit_message: Rebuild ${{ matrix.year }} supply and custody from token contracts
                  commit_user_name: GitHub Action
                  commit_user_email: action@github.com
                  commit_author: actions-user <action@github.com>
                  file_pattern: "*.csv"

    feeds:
        # Backing of assets on chains without an archive RPC, from the whole round history of their
        # Chainlink Proof of Reserves feed on Ethereum (Kinesis Gold and Silver, scripts/history/kinesis_por.ts).
        needs: onchain
        if: ${{ always() && (inputs.part == 'both' || inputs.part == 'onchain') && needs.onchain.result != 'failure' }}
        runs-on: ubuntu-latest
        timeout-minutes: 120
        name: Proof of Reserves feeds
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Checkout Records
              uses: actions/checkout@v7
              with:
                  # Private repository. Needs a deploy key of bcked/bcked-records with write access.
                  repository: bcked/bcked-records
                  ref: records
                  path: .records
                  ssh-key: ${{ secrets.RECORDS_DEPLOY_KEY }}
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - name: Install Dependencies
              run: bun install --frozen-lockfile
            - name: Rebuild Kinesis Backing
              working-directory: .records
              env:
                  ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
              run: bun ../scripts/history/kinesis_por.ts
            - name: Commit Results
              uses: stefanzweifel/git-auto-commit-action@v7
              with:
                  repository: .records
                  commit_message: Rebuild backing from Proof of Reserves feeds
                  commit_user_name: GitHub Action
                  commit_user_email: action@github.com
                  commit_author: actions-user <action@github.com>
                  file_pattern: "*.csv"
