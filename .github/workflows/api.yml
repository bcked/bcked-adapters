name: API Build and Deployment

on:
    workflow_run:
        workflows:
            - Code Build and Test
            - Crawler Execution
        types:
            - completed
        branches: [main]
    workflow_dispatch:

permissions:
    contents: read
    pages: write # to deploy to Pages
    id-token: write # to verify the deployment originates from an appropriate source

concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        name: API Build
        # Build after a successful code build, after every finished crawl (a crawl with failures
        # still commits the data it collected), or when started manually.
        if: >-
            github.event_name == 'workflow_dispatch' ||
            github.event.workflow_run.conclusion == 'success' ||
            (github.event.workflow_run.name == 'Crawler Execution' &&
             github.event.workflow_run.conclusion == 'failure')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7
            - name: Checkout Records
              uses: actions/checkout@v7
              with:
                  ref: records
                  path: .records
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: package.json
            - name: Setup Pages
              uses: actions/configure-pages@v6
            - name: Install Dependencies
              run: bun install --frozen-lockfile
            - name: Load Records
              run: rsync -a --prune-empty-dirs --include='*/' --include='**/records/**' --exclude='*' .records/ ./
            - name: Execute API Job
              env:
                  BCKED_WATCHER_BOT_TOKEN: ${{ secrets.BCKED_WATCHER_BOT_TOKEN }}
              run: bun run api
            - name: Verify API Build
              run: bun run verify-api
            - name: Copy API Documentation to API Directory
              run: cp -r docs api
            - name: Upload Artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: "api"

    deploy:
        needs: build

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        name: API Deployment
        runs-on: ubuntu-latest
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5
